plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle 2 — the current NeoForge build plugin (replaces NeoGradle).
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neo_version

    // No mappings/parchment block: 26.1+ Minecraft ships DEOBFUSCATED (Mojang
    // names), which is also why the mixins need no refmap and are identical to
    // the Fabric branch's.

    runs {
        client {
            client()
        }
    }

    mods {
        "vivemonkecraft" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Cloth Config (the slider/toggle widgets the config screen is built from)
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    // Cloth Config, NeoForge flavour. Compile-only + runtime-optional: the mod
    // checks VmcClothConfig.present() before ever touching a Cloth type, so it
    // runs fine without Cloth installed and simply offers no config screen.
    //
    // NOTE: Vivecraft is deliberately NOT a dependency here. VivecraftBridge talks
    // to it purely by reflection, which is exactly why this port needed no new VR
    // API sourcing — Vivecraft's org.vivecraft.* classes live in its shared
    // "common" module and are identical on Fabric, NeoForge and Forge.
    // compileOnly, not implementation: Cloth must NOT be bundled or hard-required.
    // Players install it themselves; without it the mod runs and just doesn't offer
    // a config screen. Add it to a dev run's mods folder if you want to see the GUI.
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
}

java {
    // Mojang ships Java 25 to end users in 26.2.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    def expandProps = [
            "version"          : project.version,
            "minecraft_version": project.minecraft_version,
            "neo_version"      : project.neo_version
    ]
    inputs.properties(expandProps)
    filteringCharset "UTF-8"
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand expandProps
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
