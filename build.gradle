plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle 2 — the current NeoForge build plugin (replaces NeoGradle).
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neo_version

    // 26.1+ Minecraft ships DEOBFUSCATED (Mojang names) and NeoForge always runs on
    // Mojang mappings, so the mixins need no refmap. No mappings/parchment block.

    runs {
        client {
            client()
        }
    }

    mods {
        "vivemonkecraft" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Cloth Config (the slider/toggle widgets the config screen is built from)
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    // Cloth Config, NeoForge flavour. compileOnly + runtime-optional: the mod checks
    // VmcClothConfig.present() before ever touching a Cloth type, so it runs fine
    // without Cloth installed and simply offers no config screen.
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
}

java {
    // Mojang ships Java 25 to end users in 26.1+.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    def expandProps = [
            "version"          : project.version,
            "minecraft_version": project.minecraft_version,
            "neo_version"      : project.neo_version
    ]
    inputs.properties(expandProps)
    filteringCharset "UTF-8"
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand expandProps
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
