plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    // ForgeGradle 7 — the build plugin for modern (1.21.x / 26.x) Forge.
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // REQUIRED by ForgeGradle 7: the "mavenizer" is FG's local repository holding
    // the patched/recompiled Minecraft+Forge artifact it builds on first run.
    // Without this line the forge dependency below resolves to ZERO files and every
    // net.minecraft.* import fails with a misleading "package does not exist".
    minecraft.mavenizer(delegate)
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    // Mojang's own library host — Minecraft's transitive deps (authlib, brigadier,
    // datafixerupper, ...) are published here and nowhere else.
    maven { url = "https://libraries.minecraft.net/" }
}

dependencies {
    // No mappings block: 26.1+ Minecraft ships DEOBFUSCATED (Mojang names), which
    // is also why the mixins need no refmap and are identical to the other branches.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // NO Cloth Config: it has no Forge build for 1.21.4+/26.x. The config screen on
    // this branch (VmcForgeConfigScreen) is built from pure VANILLA widgets and needs
    // no dependency. Vivecraft is absent too, on purpose: VivecraftBridge reaches it
    // by reflection, which is why this port needed no VR API on any loader.
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

processResources {
    def expandProps = [
            "version"          : project.version,
            "minecraft_version": project.minecraft_version,
            "forge_version"    : project.forge_version
    ]
    inputs.properties(expandProps)
    filteringCharset "UTF-8"
    filesMatching(["META-INF/mods.toml"]) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                // MixinConfigs is how FORGE discovers mixin configs -- it does NOT
                // read a [[mixins]] table from mods.toml the way NeoForge does.
                // Without this line the jar loads but NONE of the mixins apply, so the
                // mod does nothing. Comma-separate if more configs are ever added.
                "MixinConfigs"          : "vivemonkecraft.client.mixins.json",
                "Specification-Title"   : "vivemonkecraft",
                "Specification-Vendor"  : "Laggyboi",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "Laggyboi"
        ])
    }
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
