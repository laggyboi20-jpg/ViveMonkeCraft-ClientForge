plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    // ForgeGradle 7 — the build plugin for modern (26.x) Forge.
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // REQUIRED by ForgeGradle 7: the "mavenizer" is FG's local repository holding
    // the patched/recompiled Minecraft+Forge artifact it builds on first run.
    // Without this line the forge dependency below resolves to ZERO files and every
    // net.minecraft.* import fails with a misleading "package does not exist".
    minecraft.mavenizer(delegate)
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    // Mojang's own library host — Minecraft's transitive deps (authlib, blocklist,
    // brigadier, datafixerupper, ...) are published here and nowhere else.
    maven { url = "https://libraries.minecraft.net/" }
}

dependencies {
    // No mappings block: 26.1+ Minecraft ships DEOBFUSCATED (Mojang names), which
    // is also why the mixins need no refmap and are identical to the Fabric branch's.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // NOTE: Cloth Config is DELIBERATELY ABSENT here — see the sourceSets exclude
    // below. Vivecraft is absent too, on purpose: VivecraftBridge reaches it purely
    // by reflection, which is why this port needed no VR API for any loader.
}

// ---------------------------------------------------------------------------
// NO CONFIG SCREEN ON FORGE
// ---------------------------------------------------------------------------
// Cloth Config has no Forge build for Minecraft 26.x — shedaniel's maven stops at
// cloth-config-forge 17.x (roughly the 1.20 era); 26.1.154 / 26.2.155 exist only in
// the -fabric and -neoforge flavours. So the Cloth-based screen cannot be compiled
// on this branch.
//
// VmcConfigScreen.java is still PRESENT in the source tree (so changes to it merge
// cleanly from the base branch) — it is just excluded from compilation here. If
// Cloth ever ships a Forge build for 26.x, delete this exclude, add the dependency
// above, and add back a ConfigScreenHandler extension point in VmcBootstrap.
//
// Forge users configure the mod with:
//   * config/vivemonkecraft.properties  (every setting, live-reloadable)
//   * /vmc reload                       (re-read it without restarting)
//   * /vmc set <setting> <value>         (tab-completes every setting name)
// ---------------------------------------------------------------------------
sourceSets {
    main {
        java {
            exclude 'laggyboi/vivemonkecraft/client/VmcConfigScreen.java'
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
}

java {
    // Mojang ships Java 25 to end users in 26.2.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    def expandProps = [
            "version"          : project.version,
            "minecraft_version": project.minecraft_version,
            "forge_version"    : project.forge_version
    ]
    inputs.properties(expandProps)
    filteringCharset "UTF-8"
    filesMatching(["META-INF/mods.toml"]) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                // MixinConfigs is how FORGE discovers mixin configs -- it does NOT
                // read a [[mixins]] table from mods.toml the way NeoForge does
                // (fmlloader defines Attributes.Name("MixinConfigs")). Without this
                // line the jar loads but NONE of the 10 mixins apply, so the mod
                // does nothing: no hitbox shrink, no monke model, no hand clamp.
                // Comma-separate if more configs are ever added.
                "MixinConfigs"          : "vivemonkecraft.client.mixins.json",
                "Specification-Title"   : "vivemonkecraft",
                "Specification-Vendor"  : "Laggyboi",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "Laggyboi"
        ])
    }
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}

