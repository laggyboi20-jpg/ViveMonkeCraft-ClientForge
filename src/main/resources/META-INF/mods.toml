modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Laggyboi/ViveMonkeCraft"

[[mods]]
modId = "vivemonkecraft"
version = "${version}"
displayName = "ViveMonkeCraft"
authors = "Laggyboi"
logoFile = "assets/vivemonkecraft/icon.png"
# IGNORE_ALL_VERSION_CHECKS: this is a CLIENT-ONLY mod, so servers will not have
# it. Without this the Forge handshake flags the client as mismatched against any
# server that lacks it — the same failure mode the optional network channel in
# VmcNet is guarding against.
displayTest = "IGNORE_ALL_VERSION_CHECKS"
description = '''
Gorilla Tag-style VR locomotion for Minecraft 26.2. Requires Vivecraft 1.3.x (PCVR).
Grab surfaces with your hands and swing through the world.

Forge note: Cloth Config has no Forge build for 26.x, so this build has no in-game
config screen. Configure with config/vivemonkecraft.properties, "/vmc reload", and
"/vmc set <setting> <value>" (tab-completes every setting).
'''

[[mixins]]
config = "vivemonkecraft.client.mixins.json"

[[dependencies.vivemonkecraft]]
modId = "forge"
type = "required"
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.vivemonkecraft]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "CLIENT"

# Vivecraft is NOT declared as a hard dependency on purpose: VivecraftBridge
# reaches it entirely by reflection and degrades to "no VR" when it is absent,
# exactly as on the other loader branches.
