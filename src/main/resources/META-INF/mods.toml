# =============================================================================
# FORGE mods.toml  --  NOT interchangeable with NeoForge's neoforge.mods.toml
# =============================================================================
# Forge 26.2 rejects the NeoForge spellings with the singularly unhelpful
#     "Mod candidate <jar> contains broken toml, likely due to a typo."
# and no line number. The three differences that caused it, verified against the
# ModInfo, ModFileInfo and ModInfo.ModVersion classes in fmlloader-26.2-65.1.0.
# (Careful: this file goes through Gradle's expand(), so a literal dollar sign
# anywhere -- including in a comment -- is read as a template variable and fails
# the build. Only the intended placeholders below may use one.)
#
#   1. Dependencies use  mandatory = true/false,  NOT NeoForge's type = "required".
#      fmlloader literally contains the string "Missing required field mandatory
#      in dependency" -- this was the actual failure.
#   2. There is NO displayTest key. Client-only is declared with the root-level
#      clientSideOnly below, which ModFileInfo reads.
#   3. There is NO [[mixins]] table. Forge finds mixin configs through the
#      "MixinConfigs" JAR MANIFEST attribute -- see the jar{} block in
#      build.gradle. Declaring mixins here does nothing at all.
# =============================================================================

modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Laggyboi/ViveMonkeCraft"

# Client-only mod: Forge's replacement for the old displayTest, and the analogue of
# "environment": "client" on Fabric / dist = Dist.CLIENT on NeoForge. Stops servers
# flagging the client as mismatched for having a mod they lack. The mod must still
# be able to CONNECT to such servers -- see the optional-channel note in VmcNet.
clientSideOnly = true

[[mods]]
modId = "vivemonkecraft"
version = "${version}"
displayName = "ViveMonkeCraft"
authors = "Laggyboi"
logoFile = "assets/vivemonkecraft/icon.png"
description = '''
Gorilla Tag-style VR locomotion for Minecraft 26.2. Requires Vivecraft 1.3.x (PCVR).
Grab surfaces with your hands and swing through the world.

Forge note: Cloth Config has no Forge build for 26.x, so this build has no in-game
config screen. Configure with config/vivemonkecraft.properties, "/vmc reload", and
"/vmc set <setting> <value>" (tab-completes every setting).
'''

[[dependencies.vivemonkecraft]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.vivemonkecraft]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "CLIENT"

# Vivecraft is NOT declared as a dependency on purpose: VivecraftBridge reaches it
# entirely by reflection and degrades to "no VR" when absent, as on every branch.
